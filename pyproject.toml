[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wulfpeak"
version = "0.2.1"
description = "A strict, resumable ChIP-seq and CUT&Tag peak-calling workflow"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "WulfPeak contributors"}]
dependencies = []

[project.scripts]
wulfpeak = "wulfpeak.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
